---
deployment:
  tasks:
    - export DEPLOYPATH="$HOME/public_html/"
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/rm -rf "$DEPLOYPATH/_next"
    - /bin/cp -R out/. "$DEPLOYPATH"
    - /bin/mkdir -p "$DEPLOYPATH/api"
    - /bin/cp public/api/pmu-intake.php "$DEPLOYPATH/api/pmu-intake.php"
    - /bin/chmod 0644 "$DEPLOYPATH/api/pmu-intake.php"
